name: Deploy Core Breaker to GitHub Pages

on:
  push:
    branches: [nhn-ai]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      GITHUB_PAGES_BASE_PATH: "/game"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: node scripts/build-github-pages.mjs

      - name: Checkout blog source
        uses: actions/checkout@v4
        with:
          ref: main
          path: blog-source

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Ruby for blog
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: blog-source

      - name: Build blog with Jekyll
        working-directory: blog-source
        run: bundle exec jekyll build --destination ../_site

      - name: Add game under /game
        run: cp -R dist/client _site/game

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
