name: Deploy blog and Core Breaker

on:
  push:
    branches: [main, nhn-ai]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog source
        uses: actions/checkout@v6
        with:
          ref: main
          path: blog-source

      - name: Checkout game source
        uses: actions/checkout@v6
        with:
          ref: nhn-ai
          path: game-source

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game-source/package-lock.json

      - name: Install game dependencies
        working-directory: game-source
        run: npm ci

      - name: Build game static site
        working-directory: game-source
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: "/game"
          GITHUB_PAGES_STATIC_SHELL: "true"
        run: node scripts/build-github-pages.mjs

      - name: Setup Ruby for blog
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: blog-source

      - name: Build blog
        working-directory: blog-source
        run: bundle exec jekyll build --destination ../_site

      - name: Add game under /game
        run: cp -R game-source/dist/client _site/game

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
