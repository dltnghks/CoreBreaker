name: Deploy blog and Core Breaker

on:
  push:
    branches: [main, nhn-ai]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog source
        uses: actions/checkout@v6
        with:
          ref: main
          path: blog-source

      - name: Checkout game source
        uses: actions/checkout@v6
        with:
          ref: nhn-ai
          path: game-source

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: game-source/package-lock.json

      - name: Install game dependencies
        working-directory: game-source
        run: npm ci

      - name: Build game static site
        working-directory: game-source
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: "/game"
          GITHUB_PAGES_STATIC_SHELL: "true"
        run: node scripts/build-github-pages.mjs

      - name: Setup Ruby for blog
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: blog-source

      - name: Escape Liquid syntax in imported code samples
        working-directory: blog-source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              "_posts/2026-07-23-07-23.md": ("```jsx\n", "`{ }`안에 들어있는 코드"),
              "_posts/2026-02-05-obsidian-web-clipper.md": ("노트 내용을 이런 식으로 입력.", "근데 Gemini API를 사용하면"),
          }
          for relative, (start_marker, end_marker) in fixes.items():
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              if "{% raw %}" in text:
                  continue
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + "{% raw %}\n" + text[start:end] + "{% endraw %}\n" + text[end:]
              path.write_text(text, encoding="utf-8")
          PY

      - name: Build blog
        working-directory: blog-source
        run: bundle exec jekyll build --destination ../_site

      - name: Add game under /game
        run: cp -R game-source/dist/client _site/game

      - name: Expose game assets for absolute asset URLs
        run: |
          mkdir -p _site/assets
          cp -R game-source/dist/client/assets/. _site/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
